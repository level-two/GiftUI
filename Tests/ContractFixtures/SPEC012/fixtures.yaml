      - {event: glyph, glyph: "glyph:one", baselineX: 3, baselineY: 7}
      - {event: end-glyphs}
      - {event: finish}
    sinkCalls: {capacity: 1, begin: 1, fill: 1, stroke: 2, beginGlyphs: 1, glyph: 1, endGlyphs: 1, finish: 1, discard: 0}
    expectedResult: success
    criteria: [DR-005]
    evidenceClasses: [host-execution]

