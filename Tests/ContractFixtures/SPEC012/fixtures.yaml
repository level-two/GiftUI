    expectedHeader: {surfaceX: 0, surfaceY: 0, surfaceWidth: 20, surfaceHeight: 10, damageX: 0, damageY: 0, damageWidth: 20, damageHeight: 10, operations: 4, positionedGlyphs: 1, clipDepth: 2}
