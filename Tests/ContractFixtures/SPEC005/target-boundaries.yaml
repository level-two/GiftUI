schema_version: 1
active:
  GiftUITextResources:
    type: regular
    dependencies:
      - GiftUI
  GiftUITextResourcesTests:
    type: test
    dependencies:
      - GiftUI
      - GiftUITextResources
  GiftUIReferenceTextResources:
    type: regular
    dependencies:
      - GiftUI
      - GiftUITextResources
  GiftUIReferenceTextResourcesTests:
    type: test
    dependencies:
      - GiftUI
      - GiftUIReferenceTextResources
      - GiftUITextResources
  GiftUITextResourceFailureAdapterFixture:
    type: regular
    dependencies:
      - GiftUIFailureCore
      - GiftUITextResources
  GiftUITextResourceOwnerAdapterTests:
    type: test
    dependencies:
      - GiftUIFailureCore
      - GiftUIFailureDiagnostics
      - GiftUITextResourceFailureAdapterFixture
      - GiftUITextResources
  GiftUIRenderCore:
    type: regular
    dependencies:
      - GiftUI
      - GiftUITextResources
  GiftUILayout:
    type: regular
    dependencies:
      - GiftUI
      - GiftUISemanticCore
      - GiftUITextResources
forbidden_text_resource_imports:
  - GiftUIFailureCore
  - GiftUIFailureDiagnostics
  - GiftUIFailureExecution
  - GiftUICapabilities
  - GiftUIExecution
  - GiftUISemantics
  - GiftUILayout
  - GiftUIRenderCore
  - GiftUIRuntimeDynamic
  - GiftUIRuntimeStatic
  - GiftUIBackend
  - GiftUIReferenceTextResources
  - GiftUIPlatform
  - GiftUIDriver
  - GiftUIHost
  - GiftUIOSRTOS
  - GiftUIHAL
  - GiftUIHardware
reserved_consumers: {}
downstream_integration:
  fixture_only_consumers:
    - GiftUITextResourceFailureAdapterFixture
  direct_text_resource_consumers:
    - GiftUIReferenceTextResources
    - GiftUILayout
    - GiftUIRenderCore
    - GiftUIRasterCore
    - GiftUIBackendIntegration
    - GiftUIRenderLowering
    - GiftUIDrawing
    - GiftUIRuntimeCore
    - GiftUIHostConfiguration
  platform_roots:
    - SignalAnalyzerHost
    - SignalAnalyzerPresetHarness
  evidence:
    layout:
      source: Sources/GiftUILayout/LayoutSemanticValidation.swift
      checks:
        - Tests/GiftUILayoutTests/LayoutTextTests.swift
    render:
      source: Sources/GiftUIRenderLowering/RenderPreflight.swift
      checks:
        - Tests/GiftUIRenderLoweringTests/RenderPreflightTests.swift
    raster:
      source: Sources/GiftUIRasterCore/RasterGlyphCoverage.swift
      checks:
        - Tests/GiftUIRasterCoreTests/RasterGlyphCoverageTests.swift
    backend:
      source: Sources/GiftUIBackendIntegration/RasterTextResourceValidation.swift
      checks:
        - Tests/GiftUIBackendIntegrationTests/RasterTextResourceValidationTests.swift
    host:
      source: Sources/GiftUIHostConfiguration/CheckedMVPHostConfigurationValidator.swift
      checks:
        - Tests/GiftUIHostConfigurationTests/HostValidatorProfileAndTextTests.swift
        - Tests/GiftUIHostConfigurationTests/HostPresetBootstrapTests.swift
        - Tests/GiftUIHostConfigurationTests/SignalAnalyzerPresetHostInstanceTests.swift
identity_owners:
  - FontResourceID
  - FontInstanceID
  - GlyphID
  - RasterRealizationID
reference_compositions:
  common_sources:
    - Sources/GiftUIReferenceTextResources/Generated/ReferenceCatalogue.generated.swift
    - Sources/GiftUIReferenceTextResources/GiftUIReferenceTextResources.swift
  complete:
    payload_sources:
      - Sources/GiftUIReferenceTextResources/Generated/ReferenceBitmapPayload.generated.swift
      - Sources/GiftUIReferenceTextResources/Generated/ReferenceOutlinePayload.generated.swift
    available_realizations: [0, 1]
    required_realizations: [0, 1]
  bitmap-only:
    compilation_condition: GIFTUI_REFERENCE_BITMAP_ONLY
    payload_sources:
      - Sources/GiftUIReferenceTextResources/Generated/ReferenceBitmapPayload.generated.swift
    available_realizations: [0]
    required_realizations: [0]
    target_profile: nrf52840-embedded
  outline-only:
    compilation_condition: GIFTUI_REFERENCE_OUTLINE_ONLY
    payload_sources:
      - Sources/GiftUIReferenceTextResources/Generated/ReferenceOutlinePayload.generated.swift
    available_realizations: [1]
    required_realizations: [1]
    target_profile: contract-fixture-only
