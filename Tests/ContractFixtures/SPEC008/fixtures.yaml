schema: spec-008-fixtures-v1
cases:
  - name: nested-styles-and-sibling-restoration
    semanticEvents:
      - {identity: "identity:root", scope: structural, children: ["identity:outer-foreground", "identity:second-text"]}
      - {identity: "identity:outer-foreground", scope: foreground-green, children: ["identity:outer-background"]}
      - {identity: "identity:outer-background", scope: background-blue, children: ["identity:inner-foreground"]}
      - {identity: "identity:inner-foreground", scope: foreground-red, children: ["identity:inner-background"]}
      - {identity: "identity:inner-background", scope: background-gray, children: ["identity:first-text"]}
      - {identity: "identity:first-text", scope: text, children: []}
      - {identity: "identity:second-text", scope: text, children: []}
    identityTokens: ["identity:root", "identity:outer-foreground", "identity:outer-background", "identity:inner-foreground", "identity:inner-background", "identity:first-text", "identity:second-text"]
    semanticOrdinals: ["identity:root", "identity:outer-foreground", "identity:outer-background", "identity:inner-foreground", "identity:inner-background", "identity:first-text", "identity:second-text"]
    layoutOrdinals: ["identity:root", "identity:outer-foreground", "identity:outer-background", "identity:inner-foreground", "identity:inner-background", "identity:first-text", "identity:second-text"]
    semanticSnapshotVersion: 1
    layoutSnapshotVersion: 1
    resolvedBounds:
      - {identity: "identity:root", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:outer-foreground", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:outer-background", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:inner-foreground", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:inner-background", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:first-text", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:second-text", rect: {x: 0, y: 0, width: 40, height: 20}}
    resolvedClips:
      - {identity: "identity:root", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:outer-foreground", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:outer-background", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:inner-foreground", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:inner-background", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:first-text", rect: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:second-text", rect: {x: 0, y: 0, width: 40, height: 20}}
    clipDepths: [{identity: "identity:root", depth: 1}, {identity: "identity:outer-foreground", depth: 1}, {identity: "identity:outer-background", depth: 1}, {identity: "identity:inner-foreground", depth: 1}, {identity: "identity:inner-background", depth: 1}, {identity: "identity:first-text", depth: 1}, {identity: "identity:second-text", depth: 1}]
    traversalDepths: [{identity: "identity:root", depth: 1}, {identity: "identity:outer-foreground", depth: 2}, {identity: "identity:outer-background", depth: 3}, {identity: "identity:inner-foreground", depth: 4}, {identity: "identity:inner-background", depth: 5}, {identity: "identity:first-text", depth: 6}, {identity: "identity:second-text", depth: 2}]
    textLines:
      - {identity: "identity:first-text", lineIndex: 0, bounds: {x: 0, y: 0, width: 40, height: 20}, baseline: {x: 2, y: 8}, clip: {x: 0, y: 0, width: 40, height: 20}, glyphCount: 1, instance: "instance:fixture"}
      - {identity: "identity:second-text", lineIndex: 0, bounds: {x: 0, y: 0, width: 40, height: 20}, baseline: {x: 20, y: 8}, clip: {x: 0, y: 0, width: 40, height: 20}, glyphCount: 1, instance: "instance:fixture"}
    glyphs:
      - {identity: "identity:first-text", lineIndex: 0, glyphIndex: 0, instance: "instance:fixture", glyph: "glyph:first", baseline: {x: 2, y: 8}, clip: {x: 0, y: 0, width: 40, height: 20}}
      - {identity: "identity:second-text", lineIndex: 0, glyphIndex: 0, instance: "instance:fixture", glyph: "glyph:second", baseline: {x: 20, y: 8}, clip: {x: 0, y: 0, width: 40, height: 20}}
    resourceTokens: ["instance:fixture", "glyph:first", "glyph:second"]
    surfaceBounds: {x: 0, y: 0, width: 40, height: 20}
    damageMode: root-intersection
    rootForeground: {red: 255, green: 255, blue: 255}
    renderLimits: {maximumOperations: 4, maximumPositionedGlyphs: 2, maximumClipDepth: 2}
    workspaceCapacity: {maximumSemanticScopes: 7, maximumLayoutScopes: 7, maximumTraversalDepth: 6, maximumTextLines: 2}
    sinkCapacity: {capacityReads: 1, maximumOperations: 4, maximumPositionedGlyphs: 2}
    expectedResult: {kind: success, header: {surfaceBounds: {x: 0, y: 0, width: 40, height: 20}, damageBounds: {x: 0, y: 0, width: 40, height: 20}, operationCount: 4, positionedGlyphCount: 2, maximumObservedClipDepth: 2}}
    expectedRecordingEvents:
      - {event: begin, fields: {surfaceBounds: {x: 0, y: 0, width: 40, height: 20}, damageBounds: {x: 0, y: 0, width: 40, height: 20}, operationCount: 4, positionedGlyphCount: 2, maximumObservedClipDepth: 2}}
      - {event: fill, fields: {bounds: {x: 0, y: 0, width: 40, height: 20}, clip: {x: 0, y: 0, width: 40, height: 20}, red: 0, green: 0, blue: 255}}
      - {event: fill, fields: {bounds: {x: 0, y: 0, width: 40, height: 20}, clip: {x: 0, y: 0, width: 40, height: 20}, red: 128, green: 128, blue: 128}}
      - {event: begin-glyphs, fields: {instance: "instance:fixture", clip: {x: 0, y: 0, width: 40, height: 20}, red: 255, green: 0, blue: 0, glyphCount: 1}}
      - {event: glyph, fields: {glyph: "glyph:first", baseline: {x: 2, y: 8}}}
      - {event: end-glyphs, fields: {}}
      - {event: begin-glyphs, fields: {instance: "instance:fixture", clip: {x: 0, y: 0, width: 40, height: 20}, red: 255, green: 255, blue: 255, glyphCount: 1}}
      - {event: glyph, fields: {glyph: "glyph:second", baseline: {x: 20, y: 8}}}
      - {event: end-glyphs, fields: {}}
      - {event: finish, fields: {}}
    expectedSinkCalls: {capacity: 1, begin: 1, fill: 2, beginGlyphs: 2, glyph: 2, endGlyphs: 2, finish: 1, discard: 0}
    expectedWorkspaceCalls: {acquire: 1, semanticVisits: 7, layoutVisits: 7, currentForeground: 21, pushForeground: 3, popForeground: 3, reset: 1, foregroundHighWater: 3}
    expectedFailureMapping: none
    criteria: [RD-003, RD-004]
    evidenceClasses: [host-execution]

