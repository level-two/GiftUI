# ADR-040 counter-only reservations; analyzer build-checks.conf is unchanged.
required-config=CONFIG_MAIN_STACK_SIZE:106496
required-config=CONFIG_ISR_STACK_SIZE:8192
required-ram-limit=262144
# Payload plus unchanged 64-byte MPU guard; final image proof remains mandatory.
required-symbol-size=z_main_stack:106560
required-symbol-size=z_interrupt_stacks:8256
swift-entry-symbol=giftui_rfc014_counter_entry
required-symbol=spi_tft_initialize
required-symbol=spi_tft_shutdown
required-symbol=spi_tft_write_rgb565
required-symbol=giftui_fault_record
zero-heap=true
