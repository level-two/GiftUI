CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_FPU=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_OUTPUT_PRINT_MEMORY_USAGE=y
# The Embedded Swift renderer owns a 15,360-byte inline tile plus its bounded
# layout arena on the main stack. Phase 7 will replace this conservative bound
# with a measured high-water mark from connected hardware.
CONFIG_MAIN_STACK_SIZE=32768
