title: GiftUI project-local ILI9486 SPI display

description: |
  Hardware bring-up binding for the ILI9486 PiScreen used by GiftUI. The
  application owns controller initialization and bounded RGB565 transfers.

compatible: "giftui,ili9486"

include: spi-device.yaml

properties:
  dc-gpios:
    type: phandle-array
    required: true
    description: Command/data select; active means pixel or command data.

  reset-gpios:
    type: phandle-array
    required: true
    description: Active-low controller hardware reset.

  backlight-gpios:
    type: phandle-array
    description: |
      Optional verified backlight enable. Omit until the PiScreen backlight
      polarity and transistor stage have been confirmed on the exact board.
