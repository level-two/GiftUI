title: GiftUI project-local PiScreen ILI9486 parallel-bridge display

description: |
  Hardware bring-up binding for the ILI9486 PiScreen used by GiftUI. The
  PiScreen SPI-to-16-bit-parallel converter carries zero-extended commands and
  parameters plus native RGB565 pixel words. The application owns controller
  initialization and bounded transfers.

compatible: "giftui,ili9486"

include: spi-device.yaml

properties:
  dc-gpios:
    type: phandle-array
    required: true
    description: Command/data select; active means pixel or command data.

  reset-gpios:
    type: phandle-array
    required: true
    description: Active-low controller hardware reset.

  backlight-gpios:
    type: phandle-array
    description: |
      Optional verified backlight enable. Omit until the PiScreen backlight
      polarity and transistor stage have been confirmed on the exact board.
