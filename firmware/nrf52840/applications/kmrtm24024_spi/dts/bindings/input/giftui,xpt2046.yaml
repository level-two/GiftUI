title: GiftUI project-local XPT2046 resistive touch controller

description: |
  XPT2046 transport used by the KMRTM24024-SPI nRF52840 application. The
  application owns sampling, filtering, calibration, and input dispatch.

compatible: "giftui,xpt2046"

include: spi-device.yaml

properties:
  penirq-gpios:
    type: phandle-array
    required: true
    description: Active-low pen interrupt input.
